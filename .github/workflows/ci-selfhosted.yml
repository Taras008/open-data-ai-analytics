name: CI (self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-visualization-local:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated venv
        shell: bash
        run: |
          python -m venv .venv-ci
          source .venv-ci/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/visualization
          mkdir -p reports/figures
          mkdir -p data/raw data/processed

      - name: Run visualization module
        shell: bash
        run: |
          set -o pipefail
          source .venv-ci/bin/activate
          python src/data_load.py 2>&1 | tee artifacts/visualization/prepare.log
          python src/visualization.py 2>&1 | tee artifacts/visualization/run.log

      - name: Copy generated files
        if: always()
        run: |
          cp -r reports/figures artifacts/visualization/figures 2>/dev/null || true
          cp -r data/processed artifacts/visualization/processed 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-visualization-selfhosted
          path: artifacts/visualization