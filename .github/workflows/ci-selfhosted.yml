name: CI (self-hosted)

on:
  workflow_dispatch:

jobs:
  run-visualization-local:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/visualization
          mkdir -p reports/figures

      - name: Run visualization module
        run: |
          python src/visualization.py > artifacts/visualization/run.log 2>&1

      - name: Copy generated figures
        run: |
          cp -r reports/figures artifacts/visualization/figures 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-visualization-selfhosted
          path: artifacts/visualization