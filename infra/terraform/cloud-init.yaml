#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git

write_files:
  - path: /usr/local/bin/deploy-open-data-ai.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      APP_DIR="${app_directory}"
      REPOSITORY_URL="${repository_url}"
      REPOSITORY_BRANCH="${repository_branch}"
      ADMIN_USER="${admin_username}"

      export DEBIAN_FRONTEND=noninteractive

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc

      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      systemctl enable docker
      systemctl start docker

      usermod -aG docker "$ADMIN_USER"

      rm -rf "$APP_DIR"
      git clone --branch "$REPOSITORY_BRANCH" "$REPOSITORY_URL" "$APP_DIR"

      cd "$APP_DIR"
      docker compose up --build -d

runcmd:
  - [bash, /usr/local/bin/deploy-open-data-ai.sh]

final_message: "Open Data AI Analytics deployment finished. Check docker compose ps in ${app_directory}."
